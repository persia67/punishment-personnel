name: Tauri Lightweight Windows (.exe) & Android (.apk) Release Bot

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: ⚡ Build Tauri Lightweight Desktop (.exe / .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Tauri Desktop Installer
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Release v__VERSION__'
          releaseBody: 'Lightweight Tauri desktop release generated by GitHub Build Fixer Bot.'
          releaseDraft: false
          prerelease: false

  build-android:
    name: 🤖 Build Capacitor / Web Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build --if-present

      - name: Build Android APK
        run: |
          if [ -f "android/gradlew" ]; then
            cd android && chmod +x gradlew && ./gradlew assembleRelease
          else
            echo "No Android folder found. Skipping APK assembly step."
          fi

      - name: Archive Android Output
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

  create-release:
    name: 🚀 Publish Official GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-android-apk
          path: ./release-android
        continue-on-error: true

      - name: Publish Android Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-android/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
