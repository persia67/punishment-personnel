name: Electron Windows (.exe) & Android (.apk) Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: ⚛️ Build Electron Windows Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Package Electron App (.exe)
        run: npx electron-builder --win nsis:ia32 nsis:x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-exe
          path: dist/*.exe

  build-android:
    name: 🤖 Build Capacitor / Web Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Bundle
        run: npm run build --if-present

      - name: Build Android APK
        run: |
          if [ -d "android" ]; then
            cd android && chmod +x gradlew && ./gradlew assembleRelease
          fi

      - name: Archive Android APK
        uses: actions/upload-artifact@v4
        with:
          name: electron-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

  create-release:
    name: 🚀 Publish Official GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: electron-windows-exe
          path: ./release-windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: electron-android-apk
          path: ./release-android
        continue-on-error: true

      - name: Publish Assets to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-windows/*.exe
            ./release-android/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
